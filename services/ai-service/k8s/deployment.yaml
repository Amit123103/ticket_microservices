apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/example/ai-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: ai-service
          readinessProbe:
            httpGet:
              path: /ai/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /ai/healthz
              port: 8000
            initialDelaySeconds: 10
