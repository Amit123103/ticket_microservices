apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: ghcr.io/example/analytics-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: analytics-service
          readinessProbe:
            httpGet:
              path: /analytics/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /analytics/healthz
              port: 8000
            initialDelaySeconds: 10
