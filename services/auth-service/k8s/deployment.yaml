apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/example/auth-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: auth-service
          readinessProbe:
            httpGet:
              path: /auth/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /auth/healthz
              port: 8000
            initialDelaySeconds: 10
