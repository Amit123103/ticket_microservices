apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels:
    app: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: ghcr.io/example/booking-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: booking-service
          readinessProbe:
            httpGet:
              path: /booking/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /booking/healthz
              port: 8000
            initialDelaySeconds: 10
