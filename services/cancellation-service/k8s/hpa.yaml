apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cancellation-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cancellation-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
