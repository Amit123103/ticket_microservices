apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-service
  labels:
    app: configuration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configuration-service
  template:
    metadata:
      labels:
        app: configuration-service
    spec:
      containers:
        - name: configuration-service
          image: ghcr.io/example/configuration-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: configuration-service
          readinessProbe:
            httpGet:
              path: /configuration/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /configuration/healthz
              port: 8000
            initialDelaySeconds: 10
