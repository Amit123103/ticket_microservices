apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  labels:
    app: discovery-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: ghcr.io/example/discovery-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: discovery-service
          readinessProbe:
            httpGet:
              path: /discovery/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /discovery/healthz
              port: 8000
            initialDelaySeconds: 10
