apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  labels:
    app: logging-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      containers:
        - name: logging-service
          image: ghcr.io/example/logging-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: logging-service
          readinessProbe:
            httpGet:
              path: /logging/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /logging/healthz
              port: 8000
            initialDelaySeconds: 10
