apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/example/notification-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: notification-service
          readinessProbe:
            httpGet:
              path: /notification/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /notification/healthz
              port: 8000
            initialDelaySeconds: 10
