apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/example/payment-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: payment-service
          readinessProbe:
            httpGet:
              path: /payment/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /payment/healthz
              port: 8000
            initialDelaySeconds: 10
