apiVersion: apps/v1
kind: Deployment
metadata:
  name: pnr-service
  labels:
    app: pnr-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pnr-service
  template:
    metadata:
      labels:
        app: pnr-service
    spec:
      containers:
        - name: pnr-service
          image: ghcr.io/example/pnr-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: pnr-service
          readinessProbe:
            httpGet:
              path: /pnr/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /pnr/healthz
              port: 8000
            initialDelaySeconds: 10
