apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  labels:
    app: pricing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: ghcr.io/example/pricing-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: pricing-service
          readinessProbe:
            httpGet:
              path: /pricing/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /pricing/healthz
              port: 8000
            initialDelaySeconds: 10
