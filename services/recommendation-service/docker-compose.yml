services:
    recommendation-service:
        build:
            context: ../..
            dockerfile: services/recommendation-service/Dockerfile
        ports:
            - "8118:8000"
        environment:
            SERVICE_NAME: recommendation-service
            DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/recommendation_service
            REDIS_URL: redis://redis:6379/0
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: platform
            POSTGRES_PASSWORD: platform
            POSTGRES_DB: recommendation_service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U platform -d recommendation_service"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
