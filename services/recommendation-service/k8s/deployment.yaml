apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  labels:
    app: recommendation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: ghcr.io/example/recommendation-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: recommendation-service
          readinessProbe:
            httpGet:
              path: /recommendation/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /recommendation/healthz
              port: 8000
            initialDelaySeconds: 10
