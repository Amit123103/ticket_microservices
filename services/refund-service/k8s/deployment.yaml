apiVersion: apps/v1
kind: Deployment
metadata:
  name: refund-service
  labels:
    app: refund-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: refund-service
  template:
    metadata:
      labels:
        app: refund-service
    spec:
      containers:
        - name: refund-service
          image: ghcr.io/example/refund-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: refund-service
          readinessProbe:
            httpGet:
              path: /refund/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /refund/healthz
              port: 8000
            initialDelaySeconds: 10
