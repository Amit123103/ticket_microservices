apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  labels:
    app: review-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: ghcr.io/example/review-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: review-service
          readinessProbe:
            httpGet:
              path: /review/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /review/healthz
              port: 8000
            initialDelaySeconds: 10
