apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: ghcr.io/example/search-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: search-service
          readinessProbe:
            httpGet:
              path: /search/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /search/healthz
              port: 8000
            initialDelaySeconds: 10
