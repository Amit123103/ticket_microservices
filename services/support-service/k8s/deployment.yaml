apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-service
  labels:
    app: support-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support-service
  template:
    metadata:
      labels:
        app: support-service
    spec:
      containers:
        - name: support-service
          image: ghcr.io/example/support-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: support-service
          readinessProbe:
            httpGet:
              path: /support/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /support/healthz
              port: 8000
            initialDelaySeconds: 10
