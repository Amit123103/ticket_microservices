services:
    ticket-service:
        build:
            context: ../..
            dockerfile: services/ticket-service/Dockerfile
        ports:
            - "8113:8000"
        environment:
            SERVICE_NAME: ticket-service
            DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/ticket_service
            REDIS_URL: redis://redis:6379/0
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: platform
            POSTGRES_PASSWORD: platform
            POSTGRES_DB: ticket_service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U platform -d ticket_service"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
