apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  labels:
    app: ticket-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: ghcr.io/example/ticket-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: ticket-service
          readinessProbe:
            httpGet:
              path: /ticket/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /ticket/healthz
              port: 8000
            initialDelaySeconds: 10
