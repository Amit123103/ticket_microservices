apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/example/user-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: user-service
          readinessProbe:
            httpGet:
              path: /user/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /user/healthz
              port: 8000
            initialDelaySeconds: 10
