apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  labels:
    app: wallet-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: ghcr.io/example/wallet-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: wallet-service
          readinessProbe:
            httpGet:
              path: /wallet/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /wallet/healthz
              port: 8000
            initialDelaySeconds: 10
